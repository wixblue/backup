spring.application.name=backup

# API:t kan läsa och skriva godtyckliga mappar, så det binds bara till lokala anslutningar.
server.address=127.0.0.1

# Projekten sparas i en lokal H2-fil. Tabellerna skapas och uppdateras automatiskt.
spring.datasource.url=jdbc:h2:file:./data/backup
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Startläge för backup. false = avstängd tills den slås på via PUT /api/backup/enabled.
backup.enabled=true
